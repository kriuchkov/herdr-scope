name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race -count=1 ./...

  lint:
    # Like `make lint`: the code has unix and windows variants, so lint each
    # platform the plugin ships for.
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin, windows ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          # Keep in step with the golangci-lint `make lint` runs locally.
          version: v2.12.2
          args: --config .golangci.yaml

  dist:
    # A broken cross-compile shows up here, not when a release tag is pushed.
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the release binaries
        run: make dist
      # Every path of the install build step: a release tree's prebuilt binary,
      # a source tree with no binaries, and one with no Go either, which
      # downloads the release of its version once that release exists.
      - name: Check the install step
        run: |
          shellcheck scripts/build.sh
          mkdir -p bin
          cp build/bin/herdr-scope-linux-amd64 bin/
          sh scripts/build.sh | tee build/install.log
          grep -q 'installed the prebuilt' build/install.log
          bin/herdr-scope version
          rm -rf bin
          sh scripts/build.sh | tee build/install.log
          grep -q 'building from source' build/install.log
          bin/herdr-scope version
          rm -rf bin
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          if env PATH=/usr/bin:/bin sh -c 'command -v go'; then
            echo "::error::go is on the bare PATH, so the download path goes untested"; exit 1
          fi
          if curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/SHA256SUMS"; then
            env PATH=/usr/bin:/bin sh scripts/build.sh | tee build/install.log
            grep -q "installed the v$version release binary" build/install.log
            bin/herdr-scope version
          else
            echo "v$version is not released yet: the download path is checked once it is"
          fi
      # A Go-less install pairs this checkout's manifest with the binary of the
      # release of its version, so a released version's manifest stays as
      # released: change it, bump the version. Comments may change.
      - name: Check the manifest against its release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -n 1)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            git fetch --quiet --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
            strip() { grep -v -E '^[[:space:]]*(#|$)'; }
            if ! diff <(git show "v$version:herdr-plugin.toml" | strip) <(strip < herdr-plugin.toml); then
              echo "::error file=herdr-plugin.toml::the manifest changed since v$version, whose binary a Go-less install downloads: bump the version"
              exit 1
            fi
          fi
